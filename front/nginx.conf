server {
  listen 80;
  server_name _;
  client_max_body_size 500M;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://llm-back:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 큰 ZIP finalize(청크 합치기·SHA-256·복사)는 끝날 때까지 응답을 보내지 않아 60초(기본값)를 넘길 수 있다.
    # 시간이 지나 504가 나도 백엔드는 게시글을 계속 만들므로 대기 시간을 늘린다.
    proxy_read_timeout 600s;
  }

  # 빌드 산출물은 없으면 404여야 한다. SPA fallback이 index.html을 200으로 주면
  # 배포 뒤 옛 chunk를 요청한 브라우저가 JS 대신 HTML을 받는다.
  location /_nuxt/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
