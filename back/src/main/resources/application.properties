spring.application.name=llm-backend
app.cors.allowed-origins=http://localhost:5174,http://localhost:8083
spring.datasource.url=jdbc:postgresql://${APP_DB_HOST:host.docker.internal}:${APP_DB_PORT:5432}/${APP_DB_NAME:yangyag}?currentSchema=${APP_DB_SCHEMA:public}
spring.datasource.username=${APP_DB_USER:yangyag}
spring.datasource.password=${APP_DB_PASSWORD:yangyag1!}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${APP_DB_SCHEMA:public}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.default-schema=${APP_DB_SCHEMA:public}
spring.flyway.schemas=${APP_DB_SCHEMA:public}
spring.flyway.create-schemas=true
app.attachments.root-path=${APP_ATTACHMENTS_ROOT_PATH:${java.io.tmpdir}/llm-attachments}
app.attachments.max-count=${APP_ATTACHMENTS_MAX_COUNT:5}
app.attachments.max-generated-file-size=${APP_ATTACHMENTS_MAX_GENERATED_FILE_SIZE:2GB}
app.attachments.inline-images.max-file-size=${APP_ATTACHMENTS_INLINE_IMAGES_MAX_FILE_SIZE:10MB}
app.upload-sessions.root-path=${APP_UPLOAD_SESSIONS_ROOT_PATH:${java.io.tmpdir}/llm-upload-sessions}
app.upload-sessions.expiration-ms=${APP_UPLOAD_SESSIONS_EXPIRATION_MS:86400000}
app.upload-sessions.cleanup-fixed-delay-ms=${APP_UPLOAD_SESSIONS_CLEANUP_FIXED_DELAY_MS:3600000}
app.upload-sessions.max-decoded-chunk-size=${APP_UPLOAD_SESSIONS_MAX_DECODED_CHUNK_SIZE:8MB}
app.upload-sessions.secret=${APP_UPLOAD_SESSIONS_SECRET:defaultUploadSessionsSecretForDevelopmentOnlyMustBeAtLeast256Bits!!}
app.jwt.secret=${APP_JWT_SECRET:defaultSecretKeyForDevelopmentOnlyMustBeAtLeast256Bits!!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
spring.servlet.multipart.max-file-size=${APP_ATTACHMENTS_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${APP_ATTACHMENTS_MAX_REQUEST_SIZE:500MB}
# Tomcat maxPostSize: multipart 텍스트 필드(파일 제외) 합계 한도. 기본 2MB면 본문 한도보다 작아 긴 본문이 413이 된다.
# rich 문서 최대 5MiB(BoardRichDocumentCodec)를 Base64로 보내면 약 7MB, plain 본문 100만 자는 최대 약 4MB다.
server.tomcat.max-http-form-post-size=8MB
# 로그인 시도 제한: 클라이언트 IP마다 window 동안 max-failures번까지 시도할 수 있고 성공하면 초기화된다.
app.auth.login-attempts.max-failures=${APP_AUTH_LOGIN_MAX_FAILURES:10}
app.auth.login-attempts.window=${APP_AUTH_LOGIN_WINDOW:15m}
# 운영은 호스트 nginx -> llm-front nginx -> back 순서다. Tomcat RemoteIpValve가 X-Forwarded-For를 오른쪽부터 읽어
# 내부망 주소(10/8, 172.16/12, 192.168/16, 127/8 등)를 건너뛴 첫 주소를 클라이언트 IP로 쓴다.
# 클라이언트가 X-Forwarded-For를 위조해도 nginx가 뒤에 붙인 실제 주소가 먼저 읽힌다.
server.forward-headers-strategy=native
